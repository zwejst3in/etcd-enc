# CronJob für manuelle Rotation (Optional)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: manual-key-rotation
  namespace: kube-system
spec:
  schedule: "0 2 * * 0"  # Jeden Sonntag um 2:00 Uhr
  suspend: true  # Standardmäßig deaktiviert
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: etcd-encryption-manager
          hostNetwork: true
          containers:
          - name: manual-rotation
            image: busybox:1.36
            command: 
            - /bin/sh
            - -c
            - |
              apk add --no-cache curl python3 py3-pip jq
              pip3 install pyyaml
              curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
              chmod +x kubectl && mv kubectl /usr/local/bin/
              chmod +x /scripts/*.sh
              
              # Run single rotation
              source /scripts/config.env
              source /scripts/encryption-manager.sh
              rotate_keys
            volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: kubernetes-pki
              mountPath: /etc/kubernetes/pki
          volumes:
          - name: scripts
            configMap:
              name: encryption-manager-scripts
              defaultMode: 0755
          - name: kubernetes-pki
            hostPath:
              path: /etc/kubernetes/pki
              type: Directory
          restartPolicy: OnFailure
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule

